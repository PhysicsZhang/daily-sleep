name: Daily Commit

on:
  schedule:
    # UTC 01:37 = 北京时间 09:37；实际运行可能延迟。
    - cron: '37 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-commit
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update activity log and push
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.name "PhysicsZhang"
          git config --local user.email "69517729+PhysicsZhang@users.noreply.github.com"

          printf '%s - daily update\n' "$(date '+%Y-%m-%d %H:%M:%S %z')" >> activity.log

          git add -- activity.log
          git commit -m "Daily update: $(date '+%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main

